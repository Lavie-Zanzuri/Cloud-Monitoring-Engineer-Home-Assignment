<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Detector</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #5d6677; --line: #e2e5ea;
    --accent: #2457d6; --safe: #1f8a4c; --warn: #b7791f; --bad: #c53030;
    --safe-bg: #e8f6ee; --warn-bg: #fdf3e1; --bad-bg: #fdeaea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; margin: 16px 0; }
  header small { color: var(--muted); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin: 20px 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  textarea { width: 100%; min-height: 180px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
             font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 18px;
           font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button.secondary { background: none; color: var(--accent); border: 1px solid var(--line); }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--bad); }
  .verdict { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 8px; }
  .verdict.Safe { background: var(--safe-bg); } .verdict.Suspicious { background: var(--warn-bg); }
  .verdict.Phishing { background: var(--bad-bg); }
  .verdict .label { font-size: 22px; font-weight: 700; }
  .Safe .label { color: var(--safe); } .Suspicious .label { color: var(--warn); } .Phishing .label { color: var(--bad); }
  .bar { flex: 1; height: 10px; background: #fff; border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; }
  .meta { margin: 12px 0; display: grid; grid-template-columns: 80px 1fr; gap: 2px 12px; font-size: 14px; }
  .meta dt { color: var(--muted); } .meta dd { margin: 0; overflow-wrap: anywhere; }
  ul.findings { list-style: none; padding: 0; margin: 0; }
  ul.findings li { display: grid; grid-template-columns: 54px 110px 1fr; gap: 8px; padding: 8px 0;
                   border-top: 1px solid var(--line); }
  .pts { font-weight: 700; } .cat { color: var(--muted); font-size: 13px; }
  .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  td.subj { max-width: 280px; overflow-wrap: anywhere; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .pill.Safe { background: var(--safe-bg); color: var(--safe); }
  .pill.Suspicious { background: var(--warn-bg); color: var(--warn); }
  .pill.Phishing { background: var(--bad-bg); color: var(--bad); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin: 24px 0; }
</style>
</head>
<body>
<header><div class="wrap"><h1>Phishing Detector</h1><small>Upload an .eml file or paste an email to check it</small></div></header>

<main class="wrap">
  <section class="card">
    <h2>Scan an email</h2>
    <textarea id="content" placeholder="Paste the raw email (Gmail: ⋮ → Show original) or just the message text…"></textarea>
    <div class="row">
      <button id="scanBtn">Scan</button>
      <span class="muted">or</span>
      <input type="file" id="file" accept=".eml,.txt,message/rfc822,text/plain">
      <span id="status" class="muted"></span>
    </div>
  </section>

  <section class="card" id="resultCard" hidden>
    <h2>Result</h2>
    <div id="verdict" class="verdict">
      <span class="label" id="verdictLabel"></span>
      <span id="scoreText"></span>
      <div class="bar"><div id="scoreBar"></div></div>
    </div>
    <dl class="meta">
      <dt>From</dt><dd id="from"></dd>
      <dt>Subject</dt><dd id="subject"></dd>
    </dl>
    <ul class="findings" id="findings"></ul>
  </section>

  <section class="card">
    <div class="row" style="justify-content: space-between; margin: 0 0 8px;">
      <h2 style="margin:0">History</h2>
      <button class="secondary" id="refreshBtn">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Time</th><th>Sender</th><th>Subject</th><th>Verdict</th><th>Score</th><th>Served by</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
    <p id="historyEmpty" class="muted" hidden>No scans yet.</p>
  </section>
</main>

<footer>This page was served by <span id="servedBy">…</span></footer>

<script>
// Everything that comes from an email is attacker-controlled. It is only ever
// inserted with textContent (never innerHTML), so a malicious subject line
// cannot inject HTML or script into this page.
const $ = (id) => document.getElementById(id);
const COLORS = { Safe: "var(--safe)", Suspicious: "var(--warn)", Phishing: "var(--bad)" };

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

async function callApi(url, options) {
  const res = await fetch(url, options);
  $("servedBy").textContent = res.headers.get("X-Served-By") || "unknown";
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : `HTTP ${res.status}`);
  return body;
}

function showResult(r) {
  $("resultCard").hidden = false;
  $("verdict").className = "verdict " + r.verdict;
  $("verdictLabel").textContent = r.verdict;
  $("scoreText").textContent = `Risk score ${r.score}/100`;
  $("scoreBar").style.width = r.score + "%";
  $("scoreBar").style.background = COLORS[r.verdict];
  $("from").textContent = r.from_address ? `${r.from_name} <${r.from_address}>` : "(no headers)";
  $("subject").textContent = r.subject || "(none)";
  const list = $("findings");
  list.replaceChildren();
  if (!r.findings.length) list.append(el("li", "No phishing indicators found.", "muted"));
  for (const f of r.findings) {
    const li = el("li");
    const text = el("div");
    text.append(el("div", f.title), el("div", f.detail, "detail"));
    li.append(el("span", "+" + f.points, "pts"), el("span", f.category, "cat"), text);
    list.append(li);
  }
}

async function scan(url, options) {
  $("scanBtn").disabled = true;
  $("status").textContent = "Scanning…";
  $("status").className = "muted";
  try {
    showResult(await callApi(url, options));
    $("status").textContent = "";
    loadHistory();
  } catch (e) {
    $("status").textContent = "Error: " + e.message;
    $("status").className = "error";
  } finally {
    $("scanBtn").disabled = false;
  }
}

$("scanBtn").onclick = () => {
  const content = $("content").value;
  if (!content.trim()) { $("status").textContent = "Paste an email first."; return; }
  scan("/api/scan", { method: "POST", headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ content }) });
};

$("file").onchange = () => {
  const file = $("file").files[0];
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  scan("/api/scan/file", { method: "POST", body: form });
  $("file").value = "";
};

async function loadHistory() {
  try {
    const { scans } = await callApi("/api/history?limit=20");
    const body = $("history");
    body.replaceChildren();
    $("historyEmpty").hidden = scans.length > 0;
    for (const s of scans) {
      const tr = el("tr");
      const verdict = el("td"); verdict.append(el("span", s.verdict, "pill " + s.verdict));
      tr.append(
        el("td", new Date(s.created_at).toLocaleString()),
        el("td", s.sender || "—"),
        el("td", s.subject || "—", "subj"),
        verdict,
        el("td", String(s.score)),
        el("td", s.served_by, "muted"),
      );
      body.append(tr);
    }
  } catch (e) {
    $("historyEmpty").hidden = false;
    $("historyEmpty").textContent = "History unavailable: " + e.message;
  }
}

$("refreshBtn").onclick = loadHistory;
loadHistory();
</script>
</body>
</html>
