<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
    <style>
      .t { font-size: 19px; font-weight: 700; fill: #232f3e; }
      .s { font-size: 14px; fill: #5f6b7a; }
      .box { fill: #fff; stroke-width: 2.5; rx: 12; }
      .flow { stroke: #232f3e; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .mon { stroke: #8a94a3; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#g); }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>

  <!-- clients -->
  <rect class="box" x="20" y="90" width="170" height="70" stroke="#232f3e"/>
  <text class="t" x="105" y="122" text-anchor="middle">Browser</text>
  <text class="s" x="105" y="144" text-anchor="middle">web UI</text>
  <rect class="box" x="20" y="200" width="170" height="70" stroke="#232f3e"/>
  <text class="t" x="105" y="232" text-anchor="middle">Gmail add-on</text>
  <text class="s" x="105" y="254" text-anchor="middle">scan an email</text>

  <!-- AWS boundary -->
  <rect x="240" y="20" width="940" height="520" rx="16" fill="#f7f9fc" stroke="#232f3e" stroke-width="2"/>
  <text x="262" y="50" font-size="15" font-weight="700" fill="#232f3e">AWS · eu-north-1 · built with Terraform</text>

  <!-- ALB -->
  <rect class="box" x="280" y="125" width="170" height="110" stroke="#8c4fff"/>
  <text class="t" x="365" y="170" text-anchor="middle">Load Balancer</text>
  <text class="s" x="365" y="194" text-anchor="middle">ALB · public</text>

  <!-- ASG -->
  <rect x="500" y="70" width="240" height="220" rx="14" fill="none" stroke="#ed7100" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="620" y="94" font-size="14" font-weight="700" fill="#ed7100" text-anchor="middle">Auto Scaling group</text>
  <rect class="box" x="525" y="108" width="190" height="70" stroke="#ed7100"/>
  <text class="t" x="620" y="138" text-anchor="middle">EC2 · AZ a</text>
  <text class="s" x="620" y="160" text-anchor="middle">phishing app</text>
  <rect class="box" x="525" y="200" width="190" height="70" stroke="#ed7100"/>
  <text class="t" x="620" y="230" text-anchor="middle">EC2 · AZ b</text>
  <text class="s" x="620" y="252" text-anchor="middle">phishing app</text>

  <!-- data -->
  <rect class="box" x="800" y="80" width="200" height="80" stroke="#3b48cc"/>
  <text class="t" x="900" y="115" text-anchor="middle">RDS PostgreSQL</text>
  <text class="s" x="900" y="139" text-anchor="middle">scan history</text>
  <rect class="box" x="800" y="200" width="200" height="80" stroke="#c7131f"/>
  <text class="t" x="900" y="235" text-anchor="middle">ElastiCache</text>
  <text class="s" x="900" y="259" text-anchor="middle">cached results</text>

  <!-- private zone label -->
  <rect x="490" y="300" width="530" height="30" rx="6" fill="#eef2f7"/>
  <text x="755" y="320" font-size="13.5" fill="#3d4b5c" text-anchor="middle">private subnets · no public access</text>

  <!-- monitoring -->
  <rect class="box" x="500" y="400" width="300" height="100" stroke="#e7157b"/>
  <text class="t" x="650" y="436" text-anchor="middle">CloudWatch</text>
  <text class="s" x="650" y="460" text-anchor="middle">dashboard · logs · 10 alarms</text>
  <rect class="box" x="880" y="410" width="250" height="80" stroke="#b7791f"/>
  <text class="t" x="1005" y="445" text-anchor="middle">SNS → email</text>
  <text class="s" x="1005" y="469" text-anchor="middle">alarm notifications</text>

  <!-- arrows -->
  <path class="flow" d="M190,125 C235,125 235,165 278,165"/>
  <path class="flow" d="M190,235 C235,235 235,195 278,195"/>
  <path class="flow" d="M450,165 L523,143"/>
  <path class="flow" d="M450,195 L523,235"/>
  <path class="flow" d="M740,140 L798,122"/>
  <path class="flow" d="M740,160 L798,228"/>
  <path class="mon" d="M620,290 L620,398"/>
  <path class="mon" d="M365,235 C365,330 470,440 498,440"/>
  <path class="mon" d="M900,280 C900,350 760,360 720,398"/>
  <path class="mon" d="M800,450 L878,450"/>
</svg>
