<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8998"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #232f3e; }
      .s  { font-size: 12.5px; fill: #3d4b5c; }
      .xs { font-size: 11.5px; fill: #5f6b7a; }
      .lbl{ font-size: 13px; font-weight: 700; }
      .box{ fill: #ffffff; stroke: #232f3e; stroke-width: 1.5; rx: 8; }
      .num{ font-size: 13px; font-weight: 700; fill: #fff; }
      .flow { stroke: #232f3e; stroke-width: 2.2; fill: none; marker-end: url(#a); }
      .side { stroke: #7d8998; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#ffffff"/>

  <!-- ===== Outside AWS: clients ===== -->
  <g>
    <rect class="box" x="24" y="150" width="170" height="70"/>
    <text class="t" x="109" y="180" text-anchor="middle">User (browser)</text>
    <text class="xs" x="109" y="200" text-anchor="middle">web UI · REST API</text>

    <rect class="box" x="24" y="250" width="170" height="70"/>
    <text class="t" x="109" y="280" text-anchor="middle">Gmail add-on</text>
    <text class="xs" x="109" y="300" text-anchor="middle">"Scan this email"</text>

    <rect class="box" x="24" y="780" width="170" height="90"/>
    <text class="t" x="109" y="810" text-anchor="middle">Engineer</text>
    <text class="xs" x="109" y="830" text-anchor="middle">Terraform · AWS CLI</text>
    <text class="xs" x="109" y="848" text-anchor="middle">state in S3 (versioned,</text>
    <text class="xs" x="109" y="864" text-anchor="middle">locked)</text>
  </g>

  <!-- ===== AWS Cloud ===== -->
  <rect x="220" y="16" width="1204" height="968" rx="12" fill="#fafbfc" stroke="#232f3e" stroke-width="2"/>
  <text class="lbl" x="240" y="42" fill="#232f3e">AWS Cloud · eu-north-1 (Stockholm)</text>

  <!-- ===== VPC ===== -->
  <rect x="246" y="62" width="850" height="900" rx="10" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
  <text class="lbl" x="264" y="86" fill="#8c4fff">VPC 10.0.0.0/16</text>

  <!-- Internet Gateway on the VPC edge -->
  <rect class="box" x="590" y="44" width="170" height="40" fill="#fff"/>
  <text class="t" x="675" y="69" text-anchor="middle" font-size="14">Internet Gateway</text>

  <!-- AZ columns -->
  <rect x="270" y="100" width="395" height="845" rx="8" fill="none" stroke="#5f6b7a" stroke-dasharray="8 5" stroke-width="1.5"/>
  <text class="lbl" x="290" y="122" fill="#5f6b7a">Availability Zone a</text>
  <rect x="680" y="100" width="395" height="845" rx="8" fill="none" stroke="#5f6b7a" stroke-dasharray="8 5" stroke-width="1.5"/>
  <text class="lbl" x="722" y="122" fill="#5f6b7a">Availability Zone b</text>

  <!-- ===== Tier 1: public subnets ===== -->
  <rect x="282" y="134" width="371" height="210" rx="6" fill="#e9f5ec" stroke="#3f8624" stroke-width="1.2"/>
  <rect x="692" y="134" width="371" height="210" rx="6" fill="#e9f5ec" stroke="#3f8624" stroke-width="1.2"/>
  <text class="xs" x="294" y="152" fill="#3f8624" font-weight="700">Public subnet 10.0.1.0/24</text>
  <text class="xs" x="704" y="152" fill="#3f8624" font-weight="700">Public subnet 10.0.2.0/24</text>

  <rect class="box" x="380" y="172" width="590" height="72" stroke="#8c4fff" stroke-width="2"/>
  <text class="t" x="675" y="200" text-anchor="middle">Application Load Balancer</text>
  <text class="s" x="675" y="221" text-anchor="middle">listener :80 · health check GET /health · spans both AZs</text>
  <text class="xs" x="675" y="238" text-anchor="middle">alb-sg: in 80 from internet · out 8000 to app-sg only</text>

  <rect class="box" x="296" y="268" width="190" height="62" stroke="#3f8624"/>
  <text class="t" x="391" y="293" text-anchor="middle">NAT Gateway</text>
  <text class="xs" x="391" y="313" text-anchor="middle">outbound only · packages, APIs</text>

  <!-- ===== Tier 2: private app subnets ===== -->
  <rect x="282" y="362" width="371" height="230" rx="6" fill="#e8f1fb" stroke="#147eba" stroke-width="1.2"/>
  <rect x="692" y="362" width="371" height="230" rx="6" fill="#e8f1fb" stroke="#147eba" stroke-width="1.2"/>
  <text class="xs" x="294" y="380" fill="#147eba" font-weight="700">Private app subnet 10.0.11.0/24</text>
  <text class="xs" x="704" y="380" fill="#147eba" font-weight="700">Private app subnet 10.0.12.0/24</text>

  <rect x="300" y="396" width="745" height="190" rx="8" fill="none" stroke="#ed7100" stroke-width="2" stroke-dasharray="9 5"/>
  <text class="lbl" x="675" y="578" text-anchor="middle" fill="#ed7100">Auto Scaling group · 2–4 instances · CPU target 50%</text>

  <rect class="box" x="320" y="410" width="315" height="136" stroke="#ed7100"/>
  <text class="t" x="477" y="436" text-anchor="middle">EC2 · t3.micro · AL2023</text>
  <text class="s" x="477" y="458" text-anchor="middle">FastAPI app :8000 (systemd, non-root)</text>
  <text class="s" x="477" y="478" text-anchor="middle">CloudWatch agent: logs, memory, disk</text>
  <text class="xs" x="477" y="500" text-anchor="middle">IMDSv2 · encrypted EBS · IAM role (no keys)</text>
  <text class="xs" x="477" y="520" text-anchor="middle">app-sg: in 8000 from alb-sg only</text>

  <rect class="box" x="712" y="410" width="315" height="136" stroke="#ed7100"/>
  <text class="t" x="869" y="436" text-anchor="middle">EC2 · t3.micro · AL2023</text>
  <text class="s" x="869" y="458" text-anchor="middle">FastAPI app :8000 (systemd, non-root)</text>
  <text class="s" x="869" y="478" text-anchor="middle">CloudWatch agent: logs, memory, disk</text>
  <text class="xs" x="869" y="500" text-anchor="middle">IMDSv2 · encrypted EBS · IAM role (no keys)</text>
  <text class="xs" x="869" y="520" text-anchor="middle">app-sg: in 8000 from alb-sg only</text>

  <!-- ===== Tier 3: private data subnets ===== -->
  <rect x="282" y="610" width="371" height="322" rx="6" fill="#f3ecfd" stroke="#8c4fff" stroke-width="1.2"/>
  <rect x="692" y="610" width="371" height="322" rx="6" fill="#f3ecfd" stroke="#8c4fff" stroke-width="1.2"/>
  <text class="xs" x="294" y="628" fill="#8c4fff" font-weight="700">Private data subnet 10.0.21.0/24 · no internet route</text>
  <text class="xs" x="704" y="628" fill="#8c4fff" font-weight="700">Private data subnet 10.0.22.0/24 · no internet route</text>

  <rect class="box" x="320" y="650" width="315" height="124" stroke="#3b48cc"/>
  <text class="t" x="477" y="677" text-anchor="middle">RDS PostgreSQL 16</text>
  <text class="s" x="477" y="698" text-anchor="middle">db.t4g.micro · scan history</text>
  <text class="xs" x="477" y="719" text-anchor="middle">encrypted · TLS enforced · single-AZ (cost)</text>
  <text class="xs" x="477" y="737" text-anchor="middle">password generated in Secrets Manager</text>
  <text class="xs" x="477" y="757" text-anchor="middle">db-sg: in 5432 from app-sg only</text>

  <rect class="box" x="712" y="650" width="315" height="124" stroke="#c7131f"/>
  <text class="t" x="869" y="677" text-anchor="middle">ElastiCache · Valkey 8</text>
  <text class="s" x="869" y="698" text-anchor="middle">cache.t4g.micro · shared scan-result cache</text>
  <text class="xs" x="869" y="719" text-anchor="middle">TLS + encrypted at rest · 1 node (cache)</text>
  <text class="xs" x="869" y="737" text-anchor="middle">key analysis:v1:&lt;sha256&gt; · TTL 1 h</text>
  <text class="xs" x="869" y="757" text-anchor="middle">cache-sg: in 6379 from app-sg only</text>

  <text class="xs" x="300" y="882" font-style="italic">Each instance uses both RDS and the cache.</text>
  <text class="xs" x="300" y="900" font-style="italic">No public IPs on instances, database or cache.</text>
  <text class="xs" x="300" y="918" font-style="italic">The ALB is the only way in.</text>

  <!-- ===== Regional AWS services (outside the VPC) ===== -->
  <text class="lbl" x="1120" y="86" fill="#232f3e">Regional services</text>

  <rect class="box" x="1116" y="104" width="290" height="78" stroke="#3f8624"/>
  <text class="t" x="1261" y="130" text-anchor="middle">S3</text>
  <text class="s" x="1261" y="150" text-anchor="middle">app releases (zip per content hash)</text>
  <text class="xs" x="1261" y="168" text-anchor="middle">via free VPC gateway endpoint</text>

  <rect class="box" x="1116" y="198" width="290" height="62" stroke="#dd344c"/>
  <text class="t" x="1261" y="224" text-anchor="middle">Secrets Manager</text>
  <text class="xs" x="1261" y="244" text-anchor="middle">DB password, read at service start</text>

  <rect class="box" x="1116" y="276" width="290" height="62" stroke="#dd344c"/>
  <text class="t" x="1261" y="302" text-anchor="middle">Systems Manager</text>
  <text class="xs" x="1261" y="322" text-anchor="middle">Session Manager shell (no SSH, no port 22)</text>

  <rect class="box" x="1116" y="380" width="290" height="196" stroke="#e7157b" stroke-width="2"/>
  <text class="t" x="1261" y="406" text-anchor="middle">CloudWatch</text>
  <text class="s" x="1261" y="430" text-anchor="middle">Logs: /phishing-detector/app (JSON)</text>
  <text class="s" x="1261" y="450" text-anchor="middle">Metrics: ALB · EC2 · ASG · RDS · cache</text>
  <text class="s" x="1261" y="470" text-anchor="middle">+ agent memory/disk</text>
  <text class="s" x="1261" y="490" text-anchor="middle">+ log metrics (scans by verdict)</text>
  <text class="s" x="1261" y="514" text-anchor="middle" font-weight="700">Dashboard: phishing-detector</text>
  <text class="s" x="1261" y="536" text-anchor="middle" font-weight="700">10 alarms</text>
  <text class="xs" x="1261" y="558" text-anchor="middle">health · 5xx · p95 latency · CPU · memory · DB</text>

  <rect class="box" x="1116" y="620" width="290" height="62" stroke="#e7157b"/>
  <text class="t" x="1261" y="646" text-anchor="middle">SNS topic</text>
  <text class="xs" x="1261" y="666" text-anchor="middle">alarm + recovery notifications</text>

  <rect class="box" x="1116" y="722" width="290" height="50" fill="#fff8e1" stroke="#b7791f"/>
  <text class="t" x="1261" y="752" text-anchor="middle">✉ Email to the engineer</text>

  <!-- ===== Main request flow (solid) ===== -->
  <!-- clients -> IGW -->
  <path class="flow" d="M194,185 H233 V52 H588"/>
  <path d="M194,285 H233 V185" stroke="#232f3e" stroke-width="2.2" fill="none"/>
  <!-- IGW -> ALB -->
  <path class="flow" d="M675,84 L675,170"/>
  <!-- ALB -> EC2 a / b -->
  <path class="flow" d="M560,244 L480,408"/>
  <path class="flow" d="M790,244 L866,408"/>
  <!-- EC2 -> RDS / cache -->
  <path class="flow" d="M450,546 L450,648"/>
  <path class="flow" d="M900,546 L900,648"/>

  <!-- step numbers -->
  <g>
    <circle cx="233" cy="120" r="12" fill="#232f3e"/><text class="num" x="233" y="125" text-anchor="middle">1</text>
    <circle cx="695" cy="128" r="12" fill="#232f3e"/><text class="num" x="695" y="133" text-anchor="middle">2</text>
    <circle cx="520" cy="335" r="12" fill="#232f3e"/><text class="num" x="520" y="340" text-anchor="middle">3</text>
    <circle cx="830" cy="335" r="12" fill="#232f3e"/><text class="num" x="830" y="340" text-anchor="middle">3</text>
    <circle cx="430" cy="600" r="12" fill="#232f3e"/><text class="num" x="430" y="605" text-anchor="middle">4</text>
    <circle cx="922" cy="600" r="12" fill="#232f3e"/><text class="num" x="922" y="605" text-anchor="middle">4</text>
  </g>

  <!-- ===== Side flows (dashed) ===== -->
  <!-- EC2 outbound to NAT -->
  <path class="side" d="M360,426 L360,332"/>
  <!-- NAT -> IGW -->
  <path class="side" d="M296,299 H258 V94 H610 V87"/>
  <!-- ASG -> regional services -->
  <path class="side" d="M1045,450 C1085,450 1080,143 1114,143"/>
  <path class="side" d="M1045,465 C1090,465 1085,229 1114,229"/>
  <path class="side" d="M1045,480 C1092,480 1090,307 1114,307"/>
  <path class="side" d="M1045,495 L1114,478"/>
  <!-- CloudWatch -> SNS -> email -->
  <path class="side" d="M1261,576 L1261,618"/>
  <path class="side" d="M1261,682 L1261,720"/>
  <!-- engineer -> AWS -->
  <path class="side" d="M194,825 C232,825 232,825 268,825"/>

  <!-- ===== Legend ===== -->
  <g transform="translate(1116,800)">
    <text class="lbl" x="0" y="0" fill="#232f3e">Request path</text>
    <text class="xs" x="0" y="22">1 Client → Internet Gateway</text>
    <text class="xs" x="0" y="40">2 → ALB (only public entry point)</text>
    <text class="xs" x="0" y="58">3 → healthy instance in either AZ</text>
    <text class="xs" x="0" y="76">4 → cache (repeat scans) and RDS (history)</text>
    <line x1="0" y1="100" x2="34" y2="100" stroke="#232f3e" stroke-width="2.2"/>
    <text class="xs" x="42" y="104">request traffic</text>
    <line x1="0" y1="120" x2="34" y2="120" stroke="#7d8998" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="xs" x="42" y="124">outbound / telemetry (HTTPS 443)</text>
  </g>
</svg>
